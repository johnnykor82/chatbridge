[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chatbridge-gateway"
version = "0.2.0b10"
description = "Multi-session local HTTP gateway to user-authorized ChatGPT web conversations"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "aiohttp>=3.9,<4",
  "playwright>=1.50,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.scripts]
chatbridge = "chatbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbridge"]

[tool.hatch.build.targets.wheel.force-include]
"docs/openapi.json" = "chatbridge/openapi.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
